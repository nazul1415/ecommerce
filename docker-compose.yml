services:
  postgres:
    image: postgres:alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: go_backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:my_password@postgres:5432/postgres?sslmode=disable
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: react_admin
    ports:
      - "3001:80"
    depends_on:
      - backend

  frontend-store:
    build:
      context: ./frontend-store
      dockerfile: Dockerfile
    container_name: next_store
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
      - API_URL_SERVER=http://backend:8080/api/v1
    depends_on:
      - backend

volumes:
  postgres_data: